name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply forward migrations and runtime grants
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
          RUNTIME_DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_DATABASE_URL }}
          WORKER_DATABASE_URL: ${{ secrets.SUPABASE_WORKER_DATABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
        run: bun scripts/migrate-staging.ts

      - name: Restore temporary Railway session
        env:
          RAILWAY_CONFIG_B64: ${{ secrets.RAILWAY_CONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.railway"
          printf '%s' "$RAILWAY_CONFIG_B64" | base64 --decode > "$HOME/.railway/config.json"

      - name: Synchronize Railway variables
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          INVITATION_HMAC_KEY: ${{ secrets.INVITATION_HMAC_KEY }}
          INVITATION_DELIVERY_KEY_ID: ${{ vars.INVITATION_DELIVERY_KEY_ID }}
          INVITATION_DELIVERY_KEY: ${{ secrets.INVITATION_DELIVERY_KEY }}
          APPLICATION_WRAPPING_KEY_ID: ${{ vars.APPLICATION_WRAPPING_KEY_ID }}
          APPLICATION_WRAPPING_KEY: ${{ secrets.APPLICATION_WRAPPING_KEY }}
          APPLICATION_IDEMPOTENCY_KEY: ${{ secrets.APPLICATION_IDEMPOTENCY_KEY }}
        run: |
          bunx @railway/cli@5.43.2 variables set --skip-deploys \
            --project 20cf68d2-d1df-4291-9aea-61cfebfd758d \
            --environment production \
            --service b70c4ec1-378c-4193-9823-af3ea9df4770 \
            "SUPABASE_URL=$SUPABASE_URL" \
            "SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY" \
            "INVITATION_HMAC_KEY=$INVITATION_HMAC_KEY" \
            "INVITATION_DELIVERY_KEY_ID=$INVITATION_DELIVERY_KEY_ID" \
            "INVITATION_DELIVERY_KEY=$INVITATION_DELIVERY_KEY" \
            "APPLICATION_WRAPPING_KEY_ID=$APPLICATION_WRAPPING_KEY_ID" \
            "APPLICATION_WRAPPING_KEY=$APPLICATION_WRAPPING_KEY" \
            "APPLICATION_IDEMPOTENCY_KEY=$APPLICATION_IDEMPOTENCY_KEY"

      - name: Synchronize private worker variables
        env:
          RAILWAY_WORKER_SERVICE_ID: ${{ vars.RAILWAY_WORKER_SERVICE_ID }}
          WORKER_DATABASE_URL: ${{ secrets.SUPABASE_WORKER_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          INVITATION_DELIVERY_KEY_ID: ${{ vars.INVITATION_DELIVERY_KEY_ID }}
          INVITATION_DELIVERY_KEY: ${{ secrets.INVITATION_DELIVERY_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          INVITATION_EMAIL_FROM: ${{ secrets.INVITATION_EMAIL_FROM }}
          INVITATION_CONTROLLED_MAILBOX: ${{ secrets.INVITATION_CONTROLLED_MAILBOX }}
        run: |
          bunx @railway/cli@5.43.2 variables set --skip-deploys \
            --project 20cf68d2-d1df-4291-9aea-61cfebfd758d \
            --environment production \
            --service "$RAILWAY_WORKER_SERVICE_ID" \
            "WORKER_DATABASE_URL=$WORKER_DATABASE_URL" \
            "DATABASE_CA_CERT=$DATABASE_CA_CERT" \
            "INVITATION_DELIVERY_KEY_ID=$INVITATION_DELIVERY_KEY_ID" \
            "INVITATION_DELIVERY_KEY=$INVITATION_DELIVERY_KEY" \
            "RESEND_API_KEY=$RESEND_API_KEY" \
            "INVITATION_EMAIL_FROM=$INVITATION_EMAIL_FROM" \
            "INVITATION_CONTROLLED_MAILBOX=$INVITATION_CONTROLLED_MAILBOX"

      - name: Deploy merged source to Railway
        run: |
          bunx @railway/cli@5.43.2 up --ci \
            --project 20cf68d2-d1df-4291-9aea-61cfebfd758d \
            --environment production \
            --service b70c4ec1-378c-4193-9823-af3ea9df4770 \
            --message "Deploy $GITHUB_SHA"

      - name: Deploy private worker to Railway
        env:
          RAILWAY_WORKER_SERVICE_ID: ${{ vars.RAILWAY_WORKER_SERVICE_ID }}
        run: |
          bunx @railway/cli@5.43.2 up --ci \
            --project 20cf68d2-d1df-4291-9aea-61cfebfd758d \
            --environment production \
            --service "$RAILWAY_WORKER_SERVICE_ID" \
            --message "Deploy Invitation worker $GITHUB_SHA"

      - name: Remove temporary deployment credentials
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_SETUP_GH_TOKEN }}
        run: |
          rm -f "$HOME/.railway/config.json"
          for secret in RAILWAY_CONFIG_B64 DEPLOY_SETUP_GH_TOKEN; do
            deleted=false
            for attempt in 1 2 3; do
              if gh secret delete "$secret" --env staging; then deleted=true; break; fi
              sleep 2
            done
            if [ "$deleted" != true ]; then exit 1; fi
          done
