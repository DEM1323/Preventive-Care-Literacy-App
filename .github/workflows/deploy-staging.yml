name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply forward migrations and runtime grants
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
          RUNTIME_DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_DATABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
        run: bun scripts/migrate-staging.ts

      - name: Restore temporary Railway session
        env:
          RAILWAY_CONFIG_B64: ${{ secrets.RAILWAY_CONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.railway"
          printf '%s' "$RAILWAY_CONFIG_B64" | base64 --decode > "$HOME/.railway/config.json"

      - name: Synchronize Railway variables
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          bunx @railway/cli@5.43.2 variables set --skip-deploys \
            --project 20cf68d2-d1df-4291-9aea-61cfebfd758d \
            --environment production \
            --service b70c4ec1-378c-4193-9823-af3ea9df4770 \
            "SUPABASE_URL=$SUPABASE_URL" \
            "SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY"

      - name: Deploy merged source to Railway
        run: |
          bunx @railway/cli@5.43.2 up --ci \
            --project 20cf68d2-d1df-4291-9aea-61cfebfd758d \
            --environment production \
            --service b70c4ec1-378c-4193-9823-af3ea9df4770 \
            --message "Deploy $GITHUB_SHA"

      - name: Remove temporary deployment credentials
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_SETUP_GH_TOKEN }}
        run: |
          rm -f "$HOME/.railway/config.json"
          for secret in RAILWAY_CONFIG_B64 DEPLOY_SETUP_GH_TOKEN; do
            deleted=false
            for attempt in 1 2 3; do
              if gh secret delete "$secret" --env staging; then deleted=true; break; fi
              sleep 2
            done
            if [ "$deleted" != true ]; then exit 1; fi
          done
