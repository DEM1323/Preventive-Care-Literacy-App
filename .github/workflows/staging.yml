name: Verify staging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify source, contracts, migrations, and security
        run: bun run check

      - name: Verify deployed HTTP security controls
        env:
          STAGING_WEB_URL: ${{ vars.RAILWAY_STAGING_ORIGIN }}
        run: bun scripts/check-staging.ts

      - name: Verify real provider capabilities
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
          SUPABASE_QUEUE_NAME: ${{ vars.SUPABASE_QUEUE_NAME }}
          SUPABASE_CRON_JOB_NAME: ${{ vars.SUPABASE_CRON_JOB_NAME }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PROVIDER_SMOKE_EMAIL: ${{ secrets.PROVIDER_SMOKE_EMAIL }}
          PROVIDER_SMOKE_EMAIL_FROM: ${{ secrets.PROVIDER_SMOKE_EMAIL_FROM }}
          PROVIDER_SMOKE_AUTH_EMAIL: ${{ secrets.PROVIDER_SMOKE_AUTH_EMAIL }}
          PROVIDER_SMOKE_AUTH_PASSWORD: ${{ secrets.PROVIDER_SMOKE_AUTH_PASSWORD }}
          PROVIDER_SMOKE_AUTH_TOTP_SECRET: ${{ secrets.PROVIDER_SMOKE_AUTH_TOTP_SECRET }}
        run: bun scripts/check-providers.ts
