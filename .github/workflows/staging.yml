name: Verify staging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify source, contracts, migrations, and security
        run: bun run check

      - name: Verify deployed HTTP security controls
        env:
          STAGING_WEB_URL: ${{ vars.RAILWAY_STAGING_ORIGIN }}
        run: bun scripts/check-staging.ts
