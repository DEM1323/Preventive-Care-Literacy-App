name: Golden journey

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-golden-journey
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install browser for accessibility evidence
        run: bunx playwright install --with-deps chromium

      - name: Verify source, contracts, migrations, and security
        run: bun run check

      - name: Record expected source identity
        id: source
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Golden journey requires refs/heads/main"
            exit 1
          fi
          TREE=$(git rev-parse 'HEAD^{tree}')
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "tree=$TREE" >> "$GITHUB_OUTPUT"

      - name: Build browser artifacts for attestation comparison
        run: bun run build

      - name: Verify deployed HTTP security controls
        env:
          STAGING_WEB_URL: ${{ vars.RAILWAY_STAGING_ORIGIN }}
        run: bun scripts/check-staging.ts

      - name: Verify real provider capabilities
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
          SUPABASE_QUEUE_NAME: ${{ vars.SUPABASE_QUEUE_NAME }}
          SUPABASE_CRON_JOB_NAME: ${{ vars.SUPABASE_CRON_JOB_NAME }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PROVIDER_SMOKE_EMAIL: ${{ secrets.PROVIDER_SMOKE_EMAIL }}
          PROVIDER_SMOKE_EMAIL_FROM: ${{ secrets.PROVIDER_SMOKE_EMAIL_FROM }}
          PROVIDER_SMOKE_AUTH_EMAIL: ${{ secrets.PROVIDER_SMOKE_AUTH_EMAIL }}
          PROVIDER_SMOKE_AUTH_PASSWORD: ${{ secrets.PROVIDER_SMOKE_AUTH_PASSWORD }}
          PROVIDER_SMOKE_AUTH_TOTP_SECRET: ${{ secrets.PROVIDER_SMOKE_AUTH_TOTP_SECRET }}
        run: bun scripts/check-providers.ts

      - name: Run golden journey against deployed staging
        env:
          STAGING_WEB_URL: ${{ vars.RAILWAY_STAGING_ORIGIN }}
          EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
          EXPECTED_GIT_TREE: ${{ steps.source.outputs.tree }}
          OPERATOR_PROVISIONING_TOKEN: ${{ secrets.OPERATOR_PROVISIONING_TOKEN }}
          INVITATION_CONTROLLED_MAILBOX: ${{ secrets.INVITATION_CONTROLLED_MAILBOX }}
          DATABASE_URL: ${{ secrets.SUPABASE_RUNTIME_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
          SUPABASE_QUEUE_NAME: ${{ vars.SUPABASE_QUEUE_NAME }}
          SUPABASE_CRON_JOB_NAME: ${{ vars.SUPABASE_CRON_JOB_NAME }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PROVIDER_SMOKE_EMAIL: ${{ secrets.PROVIDER_SMOKE_EMAIL }}
          PROVIDER_SMOKE_EMAIL_FROM: ${{ secrets.PROVIDER_SMOKE_EMAIL_FROM }}
          PROVIDER_SMOKE_AUTH_EMAIL: ${{ secrets.PROVIDER_SMOKE_AUTH_EMAIL }}
          PROVIDER_SMOKE_AUTH_PASSWORD: ${{ secrets.PROVIDER_SMOKE_AUTH_PASSWORD }}
          PROVIDER_SMOKE_AUTH_TOTP_SECRET: ${{ secrets.PROVIDER_SMOKE_AUTH_TOTP_SECRET }}
          GOLDEN_JOURNEY_EVIDENCE_PATH: artifacts/golden-journey-evidence.json
          GOLDEN_JOURNEY_REF: ${{ github.ref }}
          RAILWAY_STAGING_ORIGIN: ${{ vars.RAILWAY_STAGING_ORIGIN }}
        run: bun scripts/run-golden-journey.ts

      - name: Upload redacted golden journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-journey-evidence
          path: artifacts/golden-journey-evidence.json
          if-no-files-found: ignore
          retention-days: 30
